# AI PROVIDERS (Replace with your actual keys)
# ───────────────────────────────────────────

# 🟢 OpenAI (ChatGPT)
# Get key: https://platform.openai.com/api-keys
spring.ai.openai.api-key=YOUR_OPENAI_KEY

# 🟢 Google Gemini
# Get key: https://aistudio.google.com/app/apikey
app.ai.gemini.api-key=YOUR_GEMINI_KEY

# 🟢 Anthropic (Claude)
# Get key: https://console.anthropic.com/settings/keys
spring.ai.anthropic.api-key=YOUR_ANTHROPIC_KEY

# 🟢 Local Ollama
# No key needed. Setup: https://ollama.com
spring.ai.ollama.base-url=http://localhost:11434


# CORE SETTINGS
# ───────────────────────────────────────────

# Security
jwt.secret=your-super-secret-jwt-key-minimum-256-bits-long-replace-this
jwt.expiration=86400000

# CORS — allow both the legacy and new frontends
cors.allowed-origins=http://localhost:3000,http://localhost:3001
